<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Stopou! A adedonha online, em tempo real: sorteia a letra, todo mundo escreve e quem terminar primeiro grita STOP." />
    <meta name="theme-color" content="#15309e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1030" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Stopou! · Adedonha online</title>
    <!-- Prévia do link no WhatsApp e nas redes. O endereço completo da imagem entra no build. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stopou!" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Stopou! · Bora jogar adedonha?" />
    <meta property="og:description" content="Sorteia a letra, todo mundo escreve e quem terminar primeiro grita STOP! Entra na sala e joga com a gente." />
    <meta property="og:image" content="%ENDERECO_DO_SITE%/og-stopou.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tic, o cronômetro do Stopou!, gritando STOP ao lado de vários bichos." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Aplica o tema antes de desenhar a página, para não piscar.
      try {
        var t = localStorage.getItem('stopou:tema');
        if (t !== 'claro' && t !== 'escuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.dataset.tema = t;
      } catch (e) {
        document.documentElement.dataset.tema = 'claro';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
