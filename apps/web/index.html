<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Rabisco: o Stop (adedonha) do caderno, agora online e em tempo real." />
    <meta name="theme-color" content="#fdfbf3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24332c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Rabisco · Stop online</title>
    <script>
      // Aplica o tema antes de desenhar a página, para não piscar.
      try {
        var t = localStorage.getItem('rabisco:tema');
        if (t !== 'claro' && t !== 'escuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.dataset.tema = t;
      } catch (e) {
        document.documentElement.dataset.tema = 'claro';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
